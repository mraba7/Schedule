name: Build APK

on:
  push:
    paths-ignore:
      - 'ci-logs/**'
      - 'keystore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Created once, then reused forever, so every APK carries the same
      # signature and installs over the previous one.
      - name: Ensure a stable signing key
        run: |
          if [ ! -f keystore/schedule.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/schedule.jks \
              -storepass schedule -keypass schedule -alias schedule \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Class Schedule, O=mraba7, C=SA"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f keystore/schedule.jks
            git commit -m "ci: add shared signing key [skip ci]"
            git push
          fi

      # The schedule is data, and data is where the real bugs were.
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle test --no-daemon 2>&1 | tee test-log.txt

      - name: Build release APK
        id: build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: class-schedule-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A permanent, numbered download instead of a 90-day artifact.
      - name: Publish release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "class-schedule-$VERSION.apk"
          gh release create "v$VERSION" "class-schedule-$VERSION.apk" \
            --title "جدول الحصص $VERSION" \
            --notes "بناء تلقائي من الفرع main." \
            --latest

      # The raw Actions log lives on a host I can't reach, so the build writes
      # its own output back into the repo where it can be read through the API.
      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -c 40000 build-log.txt > ci-logs/last-build.txt 2>/dev/null || echo "no build log" > ci-logs/last-build.txt
          tail -c 20000 test-log.txt > ci-logs/last-test.txt 2>/dev/null || echo "no test log" > ci-logs/last-test.txt
          find app/build/reports/tests -name "*.txt" -exec cat {} + > ci-logs/test-detail.txt 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f ci-logs/
          git commit -m "ci: build log [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done

      - name: Fail if tests or build failed
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
