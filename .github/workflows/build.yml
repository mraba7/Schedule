name: Build APK

on:
  push:
    paths-ignore:
      - 'ci-logs/**'
      - 'keystore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Created once, then reused forever, so every APK carries the same
      # signature and installs over the previous one.
      - name: Ensure a stable signing key
        run: |
          if [ ! -f keystore/schedule.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/schedule.jks \
              -storepass schedule -keypass schedule -alias schedule \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Class Schedule, O=mraba7, C=SA"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f keystore/schedule.jks
            git commit -m "ci: add shared signing key [skip ci]"
            git push
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: class-schedule-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The raw Actions log lives on a host I can't reach, so the build writes
      # its own output back into the repo where it can be read through the API.
      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -c 60000 build-log.txt > ci-logs/last-build.txt || echo "no log" > ci-logs/last-build.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f ci-logs/last-build.txt
          git commit -m "ci: build log [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
